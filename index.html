    <!-- LOW-END DEVICE PROBE. Runs before first paint (inline, in <head>) so the
         glass surfaces never render blurred and then snap opaque.

         `backdrop-filter` is the most expensive thing on this page: each one
         forces the compositor to re-read everything painted behind it on every
         frame it is on screen. There is no media query for "slow GPU", so this
         uses the two signals that exist — reported RAM and core count. Both are
         absent on Safari, which is deliberately treated as capable rather than
         low-end: iOS composites backdrop-filter well, and guessing "low" there
         would strip the effect from every iPhone. -->
    <script>
      (function () {
        var m = navigator.deviceMemory, c = navigator.hardwareConcurrency;
        if ((m && m <= 4) || (c && c <= 4)) {
          document.documentElement.setAttribute('data-perf', 'low');
        }
      })();
    </script>

    <!-- The phone's LCP element. `StoryScroll` swaps the WebGL hero for this
         poster on phones and low-end devices and only pulls the 3D chunk down
         on the first scroll, which makes this image the largest thing the page
         paints. The media query is what keeps it off desktop, where the poster
         is never rendered at all. -->

          media="(max-width: 767px)" fetchpriority="high" />

    <!-- NO hero-image preload. This used to fetch hero_background at

         hero: the 3D hero paints a WebGL canvas and the headline, so the
         preload only stole bandwidth and connection priority from the JS and
         fonts that the first paint actually waits on. -->
    <!-- ONE FAMILY, ONE FILE. Plus Jakarta Sans is a variable font, so the
         `400..800` range is served as a single woff2 per subset covering every
         weight the site uses — instead of three families (Syne, Plus Jakarta
         Sans, Inter) and twelve static weight files. 300 is not loaded on
         purpose: the old display face (Syne) had no 300 either, so those rules
         always rendered at 400 and still do. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
    
    <!-- NON-BLOCKING. `media="print"` means this sheet does not apply to the
         screen, so the browser fetches it without holding the first paint; the
         onload flips it to `all` and the fonts swap in. That matters here
         because the boot gate below carries its own inline styles and has no
         reason to wait on a third-party stylesheet three round trips away —
         and every face is already `display=swap`, so the fallback text was
         going to paint first regardless. The <noscript> copy keeps the fonts
         for a scripting-disabled visitor, who will never run the onload. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" /></noscript>

    <!-- ======================================================================
         BOOT GATE — the same closed door React renders, in static HTML.

         This is a single-page app: without it the document is an empty <div>
         and NOTHING paints until react + gsap + framer-motion have downloaded,
         parsed and mounted. Measured on a throttled phone that was 3.3s of
         white screen, and it was simultaneously the First Contentful Paint, the
         Largest Contentful Paint and the whole Speed Index — one number
         wearing three hats.

         It is deliberately a COPY of `.story__gate`, not a spinner: the visitor
         sees the real entrance immediately and React's version takes over
         underneath it with nothing to notice. Keep the two in sync — if the
         gate's wordmark or colours change in sections.css, change them here
         too, or the handoff will flicker.

         Everything is inline. A <link> would be one more round trip in front of
         the paint this exists to bring forward, which is the entire point.
         `main.tsx` removes it on the frame after React's first commit.
         ====================================================================== -->
    <div id="boot" aria-hidden="true">
      <style>
        #boot { position: fixed; inset: 0; z-index: 9999; display: flex;
          flex-direction: column; align-items: center; justify-content: center;
          gap: 0.55rem; text-align: center; padding-inline: 6vw;
          background: linear-gradient(100deg, #0c1220 0%, #1b2335 60%, #0c1220 100%); }
        /* The closed seam down the middle, glow and all. */
        #boot::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
          width: 2px; transform: translateX(-50%);
          background: linear-gradient(to bottom, transparent 0%, rgba(211,16,24,0.9) 15%,
            rgba(211,16,24,0.45) 30%, transparent 40%, transparent 60%,
            rgba(211,16,24,0.45) 70%, rgba(211,16,24,0.9) 85%, transparent 100%);
          filter: drop-shadow(0 0 6px rgba(211,16,24,0.55)); }
        #boot svg { display: block; position: relative; z-index: 1; }
        #boot b { position: relative; z-index: 1; margin-top: 0.6rem;
          font-family: 'Jakarta Boot', 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 500;
          letter-spacing: 0.14em; font-size: clamp(1.3rem, 3.6vw, 2.3rem); color: #fff; }
        #boot i { position: relative; z-index: 1; font-style: normal;
          font-family: 'Jakarta Boot', 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600;
          letter-spacing: 0.5em; font-size: 0.66rem; color: #e52e35; }
        #boot em { position: relative; z-index: 1; font-style: normal; margin-top: 1.7rem;
          padding: 0.55rem 1.15rem; border-radius: 100px;
          border: 1px solid rgba(211,16,24,0.45); background: rgba(211,16,24,0.08);
          font-family: 'Jakarta Boot', 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600;
          font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase; color: #e52e35; }
      </style>
